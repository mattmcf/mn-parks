# Mac: TCP localhost, no username (libpq uses the OS user, e.g. matt).
# Linux/cloud Unix socket: export PGHOST=/var/run/postgresql and PGUSER=ubuntu.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
<% if ENV["PGUSER"].to_s != "" %>
  username: <%= ENV["PGUSER"] %>
<% end %>
  password: <%= ENV.fetch("PGPASSWORD", "") %>

development:
  <<: *default
  database: mn_parks_development

test:
  <<: *default
  database: mn_parks_test

production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # YAML is parsed for every env, so do not ENV.fetch here — that breaks `bin/rails test`.
  # Production still needs DATABASE_URL at boot (Render sets it).
<% if ENV["DATABASE_URL"].to_s != "" %>
  url: <%= ENV["DATABASE_URL"] %>
<% end %>
